name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Neovim
        run: |
          # Download and unarchive latest stable nvim build
          curl -LO https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz
          sudo rm -rf /opt/nvim-linux-x86_64
          sudo tar -C /opt -xzf nvim-linux-x86_64.tar.gz

          # Verify installation and capture Neovim version
          /opt/nvim-linux-x86_64/bin/nvim --version

          # Expose nvim command in PATH for next steps
          echo /opt/nvim-linux-x86_64/bin >> "$GITHUB_PATH"

      - name: Run tests
        run: make test

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
